<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money — idle cash at Schwab earns 0.01%. 3-month Treasury bills pay 4.15%.</title>
<meta name="description" content="Uninvested cash in a Schwab brokerage account earns 0.01%: $10 a year on $100,000. 3-month Treasury bills, bought in the same account, pay 4.15%: $4,150. That is $4,140 a year left on the table.">
<link rel="canonical" href="https://money.ilyusha.xyz/daily">
<meta property="og:title" content="Idle cash at Schwab earns 0.01%. On $100,000 that's $10 a year.">
<meta property="og:description" content="3-month Treasury bills in the same account pay 4.15%, or $4,150 a year on $100,000. Moving it is worth $4,140 a year.">
<meta property="og:type" content="article"><meta property="og:url" content="https://money.ilyusha.xyz/daily">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml"><script src="analytics.js" defer></script>
<style>
*{box-sizing:border-box}html,body{margin:0}
body{background:#050403;color:#fff6e8;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
.sheet{position:relative;overflow:hidden;width:min(100vw,1600px);aspect-ratio:16/9;margin:0 auto;background:#0a0806}
@media(min-aspect-ratio:17/9){.sheet{width:min(1600px,96vh*1.7778)}body{padding:2vh 0}}
.sheet>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.disp{font-family:'Archivo Black','Arial Black',Impact,sans-serif}
.mono{font-family:'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;font-weight:700}
.sans{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
/* every motion shares one 4s beat, so the card loops forever with no seam */
svg *{transform-box:fill-box;transform-origin:center}
.glowA{animation:driftA 4s ease-in-out infinite}
.glowB{animation:driftB 4s ease-in-out infinite}
.shard{animation:shard 4s ease-in-out infinite}
.orbit1{animation:dash1 4s linear infinite}
.orbit2{animation:dash2 4s linear infinite}
.sun{animation:breathe 4s ease-in-out infinite}
.ripple{animation:ripple 4s cubic-bezier(.2,.6,.3,1) infinite;opacity:0}
.ripple.r2{animation-delay:-1.333s}.ripple.r3{animation-delay:-2.667s}
.sonar{animation:sonar 2s ease-out infinite;opacity:0}
.sonar.s2{animation-delay:-1s}
.speck{animation:speck 2s ease-in-out infinite}
.flow{animation:flow 2s linear infinite;opacity:0}
.flow.f2{animation-delay:-.4s}.flow.f3{animation-delay:-.8s}.flow.f4{animation-delay:-1.2s}.flow.f5{animation-delay:-1.6s}
.shine{animation:shine 4s cubic-bezier(.5,0,.3,1) infinite}
.hero{animation:heroGlow 4s ease-in-out infinite}
.pill{animation:pill 4s ease-in-out infinite}
.bad{animation:bad 2s ease-in-out infinite}
@keyframes driftA{0%,100%{transform:translate(0,0) scale(1);opacity:.8}50%{transform:translate(60px,30px) scale(1.12);opacity:1}}
@keyframes driftB{0%,100%{transform:translate(0,0) scale(1);opacity:.6}50%{transform:translate(-40px,-30px) scale(1.15);opacity:.95}}
@keyframes shard{0%,100%{opacity:.5;transform:rotate(0deg)}50%{opacity:.85;transform:rotate(2deg)}}
@keyframes dash1{to{stroke-dashoffset:-50}}
@keyframes dash2{to{stroke-dashoffset:62}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@keyframes ripple{0%{transform:scale(.12);opacity:0}15%{opacity:.5}100%{transform:scale(1);opacity:0}}
@keyframes sonar{0%{transform:scale(1);opacity:.9}100%{transform:scale(4.2);opacity:0}}
@keyframes speck{0%,100%{transform:scale(1)}50%{transform:scale(.82)}}
@keyframes flow{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translate(140px,-140px) scale(1.1);opacity:0}}
@keyframes shine{0%,35%{transform:translateX(-900px) skewX(-20deg)}75%,100%{transform:translateX(900px) skewX(-20deg)}}
@keyframes heroGlow{0%,100%{filter:drop-shadow(0 0 10px rgba(255,77,0,.35))}50%{filter:drop-shadow(0 0 34px rgba(255,140,40,.8))}}
@keyframes pill{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes bad{0%,100%{opacity:1}50%{opacity:.72}}
@media (prefers-reduced-motion:reduce){svg *{animation:none!important}.ripple,.sonar,.flow{opacity:0}}
</style></head>
<body><main class="sheet" id="brief">
<p class="sr">Uninvested cash in a Schwab brokerage account earns 0.01%, or $10 a year on $100,000. 3-month Treasury bills, bought in the same account, pay 4.15%, or $4,150 a year. Moving it is worth $4,140 a year.</p>
<svg viewBox="0 0 1600 900" role="img" aria-label="On $100,000, uninvested cash at Schwab earns $10 a year at 0.01%. 3-month Treasury bills pay $4,150 a year at 4.15%. Circles are drawn to scale.">
  <defs>
    <radialGradient id="bg" cx="22%" cy="25%" r="95%"><stop offset="0" stop-color="#1c1109"/><stop offset=".55" stop-color="#0a0806"/><stop offset="1" stop-color="#040302"/></radialGradient>
    <radialGradient id="gA" r="50%"><stop offset="0" stop-color="#ff4d00" stop-opacity=".45"/><stop offset="1" stop-color="#ff4d00" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB" r="50%"><stop offset="0" stop-color="#3dff9a" stop-opacity=".22"/><stop offset="1" stop-color="#3dff9a" stop-opacity="0"/></radialGradient>
    <radialGradient id="sunFill" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#ffe14a"/><stop offset=".5" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff4d00"/></radialGradient>
    <linearGradient id="heroFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#ffe8c8"/><stop offset="1" stop-color="#ff6a1a"/></linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#fff6e8" stroke-opacity=".05"/></pattern>
    <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="4" height="16" fill="#0a0806" opacity=".14"/></pattern>
    <clipPath id="heroClip"><text x="92" y="590" class="disp" font-size="196" letter-spacing="-8">$4,140</text></clipPath>
    <clipPath id="sunClip"><circle cx="1150" cy="420" r="310"/></clipPath>
  </defs>

  <!-- field -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle class="glowA" cx="230" cy="190" r="330" fill="url(#gA)"/>
  <circle class="glowB" cx="1430" cy="820" r="280" fill="url(#gB)"/>
  <g class="shard"><polygon points="0,0 210,0 0,250" fill="#ff4d00" opacity=".13"/></g>
  <polygon points="1600,900 1440,900 1600,700" fill="#3dff9a" opacity=".12"/>
  <polygon points="690,900 820,640 880,900" fill="#ff3d7a" opacity=".07"/>

  <!-- the comparison: two circles, area drawn to scale ($4,150 vs $10) -->
  <circle class="orbit1" cx="1150" cy="420" r="350" fill="none" stroke="#ff4d00" stroke-opacity=".45" stroke-width="2.5" stroke-dasharray="8 17"/>
  <circle class="orbit2" cx="1150" cy="420" r="382" fill="none" stroke="#ffe14a" stroke-opacity=".25" stroke-width="1.5" stroke-dasharray="2 29"/>
  <g class="sun">
    <circle cx="1150" cy="420" r="310" fill="url(#sunFill)"/>
    <g clip-path="url(#sunClip)">
      <rect x="840" y="110" width="620" height="620" fill="url(#hatch)"/>
      <circle class="ripple" cx="1150" cy="420" r="310" fill="none" stroke="#fff6e8" stroke-width="4"/>
      <circle class="ripple r2" cx="1150" cy="420" r="310" fill="none" stroke="#fff6e8" stroke-width="4"/>
      <circle class="ripple r3" cx="1150" cy="420" r="310" fill="none" stroke="#fff6e8" stroke-width="4"/>
    </g>
    <text x="1150" y="318" text-anchor="middle" class="mono" font-size="25" letter-spacing="3" fill="#2a0f02">3-MONTH</text>
    <text x="1150" y="352" text-anchor="middle" class="mono" font-size="25" letter-spacing="3" fill="#2a0f02">TREASURY BILLS</text>
    <text x="1150" y="478" text-anchor="middle" class="disp" font-size="128" letter-spacing="-5" fill="#0a0806">$4,150</text>
    <text x="1150" y="532" text-anchor="middle" class="sans" font-size="32" font-weight="800" fill="#2a0f02">a year at 4.15%</text>
  </g>

  <!-- money flowing from the speck into the sun -->
  <g fill="#3dff9a">
    <circle class="flow" cx="786" cy="785" r="6"/><circle class="flow f2" cx="786" cy="785" r="5"/>
    <circle class="flow f3" cx="786" cy="785" r="6"/><circle class="flow f4" cx="786" cy="785" r="4"/>
    <circle class="flow f5" cx="786" cy="785" r="5"/>
  </g>
  <circle class="sonar" cx="770" cy="800" r="15.2" fill="none" stroke="#ff3d7a" stroke-width="2.5"/>
  <circle class="sonar s2" cx="770" cy="800" r="15.2" fill="none" stroke="#ff3d7a" stroke-width="2.5"/>
  <circle class="speck" cx="770" cy="800" r="15.2" fill="#ff3d7a"/>
  <text x="806" y="796" class="disp" font-size="44" letter-spacing="-1" fill="#ff3d7a">$10 <tspan class="sans" font-size="28" font-weight="800" fill="#fff6e8" letter-spacing="0">a year at 0.01%</tspan></text>
  <text x="808" y="834" class="mono" font-size="20" letter-spacing="2.5" fill="#9a8f7e">UNINVESTED CASH AT SCHWAB</text>
  <text x="1508" y="876" text-anchor="end" class="mono" font-size="17" letter-spacing="3" fill="#6f665a">ON $100,000 · CIRCLES DRAWN TO SCALE</text>

  <!-- left: the words and the hero number -->
  <text x="96" y="132" class="mono" font-size="26" letter-spacing="5" fill="#ff8a3d">IDLE CASH IN A SCHWAB ACCOUNT</text>
  <text x="92" y="250" class="disp" font-size="100" letter-spacing="-4" fill="#fff6e8">Earns <tspan class="bad" fill="#ff3d7a">0.01%.</tspan></text>
  <text x="96" y="352" class="mono" font-size="24" letter-spacing="4" fill="#9a8f7e">ON $100,000 YOU MISS</text>
  <g class="hero"><text x="92" y="590" class="disp" font-size="196" letter-spacing="-8" fill="url(#heroFill)">$4,140</text></g>
  <g clip-path="url(#heroClip)"><rect class="shine" x="92" y="380" width="120" height="240" fill="#ffffff" opacity=".55"/></g>
  <text x="96" y="646" class="sans" font-size="34" font-weight="700" fill="#fff6e8">a year, vs 3-month Treasury bills</text>
  <g class="pill">
    <rect x="96" y="694" width="520" height="76" rx="38" fill="#3dff9a"/>
    <text x="356" y="744" text-anchor="middle" class="sans" font-size="31" font-weight="800" fill="#06140c">Same account. One trade.</text>
  </g>
</svg>
</main></body></html>
